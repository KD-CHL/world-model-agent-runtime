[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "world-model-agent-lab"
version = "0.0.1"
description = "API task agent, world-model planning and ROS 2 robot interfaces"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
model-runtime = ["numpy>=1.26,<3", "torch>=2.2", "Pillow>=10"]
simulation = ["mujoco>=3.2,<4", "numpy>=1.26,<3"]
walking = ["onnxruntime>=1.18,<2"]
monitor = ["numpy>=1.26,<3"]

[project.scripts]
wmal-agent = "wmal.agents.cli:run_agent"
wmal-serve = "wmal.agents.cli:serve"
wmal-monitor = "wmal.monitor.server:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
exclude = ["wmal.training", "wmal.training.*"]

[tool.setuptools.package-data]
"wmal.monitor" = ["static/*.html", "static/*.css", "static/*.js"]
